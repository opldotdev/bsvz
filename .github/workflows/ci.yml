name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "master"]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Build
        run: zig build --summary all
      - name: Test (ReleaseFast, UB checks enabled)
        run: zig build test -Doptimize=ReleaseFast --summary all
